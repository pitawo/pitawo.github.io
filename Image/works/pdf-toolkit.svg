<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t">
  <title id="t">左にアップロードしたファイルの一覧、右に変換オプションが並んだ画面のイメージ</title>

  <rect width="800" height="500" fill="#fafafb"/>

  <!-- window -->
  <rect x="40.5" y="40.5" width="719" height="419" rx="4" fill="#ffffff" stroke="#ebebef"/>
  <line x1="40.5" y1="80.5" x2="759.5" y2="80.5" stroke="#ebebef"/>
  <circle cx="62" cy="60" r="3.5" fill="#d8d8e0"/>
  <circle cx="76" cy="60" r="3.5" fill="#d8d8e0"/>
  <circle cx="90" cy="60" r="3.5" fill="#d8d8e0"/>
  <rect x="330" y="55" width="140" height="10" rx="2" fill="#f2f3fd"/>

  <!-- sidebar -->
  <line x1="288.5" y1="80.5" x2="288.5" y2="459.5" stroke="#ebebef"/>
  <rect x="72" y="108" width="60" height="8" rx="2" fill="#9a9aa6"/>

  <!-- upload area -->
  <rect x="72.5" y="132.5" width="184" height="64" rx="4" fill="#f2f3fd" stroke="#d8d8e0"/>
  <rect x="140" y="152" width="48" height="8" rx="2" fill="#9a9aa6"/>
  <rect x="128" y="170" width="72" height="10" rx="3" fill="#ffffff" stroke="#d8d8e0"/>

  <!-- file list with reorder buttons -->
  <rect x="72" y="222" width="44" height="7" rx="2" fill="#9a9aa6"/>
  <g>
    <rect x="72.5" y="244.5" width="184" height="34" rx="4" fill="#ffffff" stroke="#ebebef"/>
    <rect x="86" y="255" width="12" height="14" rx="2" fill="#667eea"/>
    <rect x="108" y="258" width="80" height="7" rx="2" fill="#666672"/>
    <rect x="206" y="253" width="14" height="7" rx="2" fill="#e6e6ec"/>
    <rect x="206" y="264" width="14" height="7" rx="2" fill="#e6e6ec"/>

    <rect x="72.5" y="288.5" width="184" height="34" rx="4" fill="#ffffff" stroke="#ebebef"/>
    <rect x="86" y="299" width="12" height="14" rx="2" fill="#d8d8e0"/>
    <rect x="108" y="302" width="62" height="7" rx="2" fill="#666672"/>
    <rect x="206" y="297" width="14" height="7" rx="2" fill="#e6e6ec"/>
    <rect x="206" y="308" width="14" height="7" rx="2" fill="#e6e6ec"/>

    <rect x="72.5" y="332.5" width="184" height="34" rx="4" fill="#ffffff" stroke="#ebebef"/>
    <rect x="86" y="343" width="12" height="14" rx="2" fill="#d8d8e0"/>
    <rect x="108" y="346" width="94" height="7" rx="2" fill="#666672"/>
    <rect x="206" y="341" width="14" height="7" rx="2" fill="#e6e6ec"/>
    <rect x="206" y="352" width="14" height="7" rx="2" fill="#e6e6ec"/>
  </g>

  <!-- main: options -->
  <rect x="320" y="108" width="52" height="8" rx="2" fill="#9a9aa6"/>

  <rect x="320.5" y="136.5" width="11" height="11" rx="2" fill="#667eea"/>
  <rect x="344" y="138" width="120" height="8" rx="2" fill="#666672"/>
  <rect x="320.5" y="166.5" width="11" height="11" rx="2" fill="#667eea"/>
  <rect x="344" y="168" width="96" height="8" rx="2" fill="#666672"/>
  <rect x="320.5" y="196.5" width="11" height="11" rx="2" fill="#ffffff" stroke="#d8d8e0"/>
  <rect x="344" y="198" width="134" height="8" rx="2" fill="#9a9aa6"/>

  <!-- convert button -->
  <rect x="320" y="234" width="120" height="30" rx="4" fill="#667eea"/>
  <rect x="352" y="245" width="56" height="8" rx="2" fill="#ffffff"/>

  <!-- result -->
  <line x1="320.5" y1="294.5" x2="727.5" y2="294.5" stroke="#ebebef"/>
  <rect x="320" y="316" width="40" height="7" rx="2" fill="#9a9aa6"/>

  <rect x="320.5" y="338.5" width="407" height="52" rx="4" fill="#ffffff" stroke="#ebebef"/>
  <rect x="338" y="356" width="14" height="18" rx="2" fill="#667eea"/>
  <rect x="366" y="359" width="150" height="8" rx="2" fill="#2a2a33"/>
  <rect x="366" y="374" width="70" height="6" rx="2" fill="#e6e6ec"/>
  <rect x="608" y="354" width="102" height="22" rx="4" fill="#f2f3fd" stroke="#d8d8e0"/>
  <rect x="638" y="362" width="42" height="7" rx="2" fill="#667eea"/>
