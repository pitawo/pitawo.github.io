<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details - ぴたお@AI🤖 Portfolio</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="animations.css">
    <style>
        .detail-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            padding-top: 120px;
        }
        
        .detail-header {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .detail-title {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #333;
        }
        
        .detail-subtitle {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 2rem;
        }
        
        .detail-image {
            width: 100%;
            max-width: 600px;
            height: 300px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 3rem;
        }
        
        .detail-content {
            display: grid;
            gap: 2rem;
            margin-bottom: 3rem;
        }
        
        .detail-section {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        
        .detail-section h3 {
            color: #333;
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }
        
        .detail-section p, .detail-section li {
            line-height: 1.8;
            color: #555;
            margin-bottom: 1rem;
        }
        
        .detail-section ul {
            padding-left: 1.5rem;
        }
        
        .tech-stack {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        
        .tech-tag {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }
        
        .back-button {
            position: fixed;
            top: 100px;
            left: 2rem;
            background: rgba(255,255,255,0.9);
            border: none;
            padding: 1rem;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            z-index: 1000;
        }
        
        .back-button:hover {
            background: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(0,0,0,0.15);
        }
        
        .back-button svg {
            width: 24px;
            height: 24px;
            fill: #333;
        }
        
        @media (max-width: 768px) {
            .detail-container {
                padding: 1rem;
                padding-top: 100px;
            }
            
            .detail-title {
                font-size: 2rem;
            }
            
            .back-button {
                top: 80px;
                left: 1rem;
            }
        }
    </style>
</head>
<body>

    <button class="back-button" onclick="history.back()">

    <main>
        <div class="detail-container">

                <img class="detail-image" id="projectImage" src="" alt="Project Image">

            <div class="detail-content" id="detailContent">

            'gas': {

                    },
                    {

                        content: `
                            <ul>
                                <li>スプレッドシート自動レポート生成</li>
                                <li>Gmail自動メール配信システム</li>
                                <li>Googleフォーム回答自動処理</li>

                    }
                ]
            }
        };

        // Get project type from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const projectType = urlParams.get('project') || 'dify';

        // Populate page with project data
        function loadProjectDetails(type) {
            const data = projectData[type];
            if (!data) return;

            document.getElementById('projectTitle').textContent = data.title;
            document.getElementById('projectSubtitle').textContent = data.subtitle;
            document.getElementById('projectImage').src = data.image;
            document.getElementById('projectImage').alt = data.title;
            document.title = `${data.title} - Portfolio`;

            const contentContainer = document.getElementById('detailContent');
            contentContainer.innerHTML = '';

            data.sections.forEach(section => {
                const sectionElement = document.createElement('div');
                sectionElement.className = 'detail-section';
                sectionElement.innerHTML = `
                    <h3>${section.title}</h3>
                    ${section.content}
                `;
                contentContainer.appendChild(sectionElement);
            });
        }

        // Load project details on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadProjectDetails(projectType);
        });
    </script>
</body>
</html>
